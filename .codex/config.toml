# Project-local profile. Requires a trusted project and a sandboxed session.
# Do not combine default_permissions with sandbox_mode/sandbox_workspace_write.
default_permissions = "project-secrets-blocked"

[agents]
enabled = true

[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '''python3 -B -c "import pathlib, runpy, subprocess; runpy.run_path(str(pathlib.Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()) / '.codex/hooks/protect_commit.py'), run_name='__main__')"'''
command_windows = '''python -B -c "import pathlib, runpy, subprocess; runpy.run_path(str(pathlib.Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()) / '.codex/hooks/protect_commit.py'), run_name='__main__')"'''
# The script returns an explicit deny after 240 seconds, before hook timeout.
timeout = 300
statusMessage = "Protection Hook: 커밋 전 전체 테스트 확인"

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|Write|Bash)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '''python3 -B -c "import pathlib, runpy, subprocess; runpy.run_path(str(pathlib.Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()) / '.codex/hooks/remind_tdd.py'), run_name='__main__')"'''
command_windows = '''python -B -c "import pathlib, runpy, subprocess; runpy.run_path(str(pathlib.Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()) / '.codex/hooks/remind_tdd.py'), run_name='__main__')"'''
timeout = 10
statusMessage = "TDD Reminder: TypeScript 편집 전 규칙 확인"
additionalContextLimit = 6000

[permissions.project-secrets-blocked]
description = "Edit project code while denying credential and secret files."
extends = ":workspace"

[permissions.project-secrets-blocked.filesystem]
# Windows/Linux glob matches are snapshotted per process, up to this depth.
glob_scan_max_depth = 16

[permissions.project-secrets-blocked.filesystem.":workspace_roots"]
# Exact paths protect stable locations as well as glob matches.
".env" = "deny"
".env.local" = "deny"
".env.development" = "deny"
".env.production" = "deny"
".env.test" = "deny"
"secrets" = "deny"
".secrets" = "deny"
"secret" = "deny"
"credentials" = "deny"
".credentials" = "deny"
"credential" = "deny"
"credentail" = "deny"
".ssh" = "deny"
".aws" = "deny"
".azure" = "deny"
".npmrc" = "deny"
".pypirc" = "deny"
".netrc" = "deny"
# Include example files and case variants; do not inspect them to decide safety.
"**/.[eE][nN][vV]*" = "deny"
"**/*.[eE][nN][vV]" = "deny"
"**/[sS][eE][cC][rR][eE][tT]*" = "deny"
"**/.[sS][eE][cC][rR][eE][tT]*" = "deny"
"**/[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL]*" = "deny"
"**/.[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL]*" = "deny"
"**/[cC][rR][eE][dD][eE][nN][tT][aA][iI][lL]*" = "deny"
"**/*[sS][eE][rR][vV][iI][cC][eE][-_][aA][cC][cC][oO][uU][nN][tT]*.json" = "deny"
"**/*.[pP][eE][mM]" = "deny"
"**/*.[kK][eE][yY]" = "deny"
"**/*.[pP]12" = "deny"
"**/*.[pP][fF][xX]" = "deny"
"**/*.[jJ][kK][sS]" = "deny"
"**/id_rsa*" = "deny"
"**/id_ed25519*" = "deny"
"**/.ssh" = "deny"
"**/.aws" = "deny"
"**/.azure" = "deny"
"**/.npmrc" = "deny"
"**/.pypirc" = "deny"
"**/.netrc" = "deny"
